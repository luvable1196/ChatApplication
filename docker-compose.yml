version: "3.8"

services:
  postgres:
    image: postgres:15
    container_name: chat_postgres
    environment:
      POSTGRES_USER: chatuser
      POSTGRES_PASSWORD: chatpass
      POSTGRES_DB: chatdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mongodb:
    image: mongo:6
    container_name: chat_mongodb
    environment:
      MONGO_INITDB_DATABASE: chatdb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7
    container_name: chat_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  frontend:
    image: node:18-alpine
    container_name: chat_frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "3000:3000"
    environment:
      - HOST=0.0.0.0
      - CHOKIDAR_USEPOLLING=true
    command: >
      sh -c "
        echo 'Starting fresh installation...' &&
        rm -rf node_modules &&
        echo 'Installing dependencies...' &&
        npm install &&
        echo 'Starting development server...' &&
        npm start
      "
    stdin_open: true
    tty: true

volumes:
  postgres_data:
  mongo_data:
  redis_data: